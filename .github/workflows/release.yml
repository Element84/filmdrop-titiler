name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-lambda-package:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: titiler-lambda-python3.13.zip
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # run in docker container to compile in format compatible with lambda
      - name: Build Lambda package in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            public.ecr.aws/lambda/python:3.13 \
            bash -c "
              pip install uv &&
              mkdir -p lambda-package &&
              uv pip install --python-platform manylinux_2_28_x86_64 --target lambda-package . &&
              cd lambda-package &&
              find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true &&
              find . -name '*.pyc' -delete &&
              find . -type d -name 'tests' -exec rm -rf {} + 2>/dev/null || true &&
              zip -r9 ../\$PACKAGE_NAME . -x '*.dist-info/RECORD' '*.dist-info/INSTALLER'
            "

      - name: Upload Lambda package to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ env.PACKAGE_NAME }}
          asset_name: ${{ env.PACKAGE_NAME }}
          asset_content_type: application/zip